<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>World ID Callback</title>
</head>
<body>
  <div id="status">Processing World ID verification...</div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");
    const savedState = sessionStorage.getItem("worldid_state");

    if (!code || !state || state !== savedState) {
      document.getElementById("status").textContent = "Invalid state or missing code.";
      setTimeout(() => {
        window.location.href = "/";
      }, 3000);
    } else {
      fetch("/api/exchange-token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          // Store verification data in localStorage
          const verificationData = {
            verified: true,
            timestamp: Date.now(),
            tokenData: data.tokenData
          };
          localStorage.setItem("worldid_verification", JSON.stringify(verificationData));
          
          document.getElementById("status").textContent = "✅ Verified with World ID - Redirecting...";
          
          // Redirect back to main page after 2 seconds
          setTimeout(() => {
            window.location.href = "/";
          }, 2000);
        } else {
          document.getElementById("status").textContent = "❌ Verification failed";
          setTimeout(() => {
            window.location.href = "/";
          }, 3000);
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById("status").textContent = "Error verifying World ID.";
        setTimeout(() => {
          window.location.href = "/";
        }, 3000);
      });
    }
  </script>
</body>
</html>
