<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Cache busting meta tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="manifest" href="assets/site.webmanifest">
    <title>Pixel Pounders - NFT Game</title>
    
    <!-- World ID will use local implementation due to CDN restrictions -->
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Press Start 2P', monospace;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 20px;
            cursor: crosshair;
        }
         .neon-button {
        position: relative;
        padding: 20px 40px;
        background: linear-gradient(45deg, #0a0a0a, #1a1a1a);
        border: 2px solid #f15e00;
        border-radius: 8px;
        color: #f15e00;
        font-family: 'Press Start 2P', monospace;
        font-weight: 400;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: grab;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 15px;
        box-shadow: 
            0 0 20px rgba(241, 94, 0, 0.3),
            inset 0 0 20px rgba(241, 94, 0, 0.1);
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
    }

    .neon-button::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(45deg, #f15e00, #ff8c42, #f15e00);
        border-radius: 8px;
        z-index: -1;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .neon-button:hover {
        color: #ffffff;
        text-shadow: 
            0 0 10px #f15e00,
            0 0 20px #f15e00,
            0 0 30px #f15e00;
        box-shadow: 
            0 0 30px rgba(241, 94, 0, 0.6),
            0 0 60px rgba(241, 94, 0, 0.4),
            inset 0 0 30px rgba(241, 94, 0, 0.2);
        transform: translateY(-2px) scale(1.05);
    }

    .neon-button:hover::before {
        opacity: 0.7;
    }

    .neon-button:active {
        transform: translateY(0) scale(1.02);
    }

    .icon {
        width: 24px;
        height: 24px;
        color: currentColor;
        filter: drop-shadow(0 0 8px #f15e00);
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
    }

    .neon-button:hover .icon {
        filter: drop-shadow(0 0 15px #f15e00) drop-shadow(0 0 25px #f15e00);
    }

    /* Pixelated glow animation */
    @keyframes pixelGlow {
        0%, 100% { 
            box-shadow: 
                0 0 20px rgba(241, 94, 0, 0.3),
                inset 0 0 20px rgba(241, 94, 0, 0.1);
        }
        50% { 
            box-shadow: 
                0 0 35px rgba(241, 94, 0, 0.5),
                inset 0 0 30px rgba(241, 94, 0, 0.2);
        }
    }

    .neon-button {
        animation: pixelGlow 2s ease-in-out infinite;
        margin-top: 20px;
    }

    /* Responsive design */
    @media (max-width: 768px) {
        body {
            flex-direction: column;
            gap: 40px;
            padding: 20px;
        }
        
        .neon-button {
            padding: 16px 32px;
            font-size: 10px;
        }
    }

    /* Scanline effect for extra retro feel */
    .neon-button::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 2px,
            rgba(241, 94, 0, 0.03) 2px,
            rgba(241, 94, 0, 0.03) 4px
        );
        pointer-events: none;
        border-radius: 6px;
    }

        .game-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-image: url('assets/gamebg.png');
            opacity: 0.4;
            z-index: -4;
        }
        /* Neon background */
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 25% 25%, rgba(0, 102, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(255, 102, 0, 0.1) 0%, transparent 50%);
            z-index: -3;
        }

        .footer-container {
            display: inline-block;
            margin-right: 20px; /* Optional: Add some spacing between the images */
            margin-bottom: 20px; /* Optional: Add some spacing below the images */
            }
        .footer-container img {
            display: inline-block; /* Or inline-flex, if you want to use flexbox */
            }
        
        /* Animated neon grid */
        .neon-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 102, 255, 0.4) 1px, transparent 2px),
                linear-gradient(90deg, rgba(0, 102, 255, 0.4) 1px, transparent 2px);
            background-size: 30px 30px;
            animation: gridPulse 4s ease-in-out infinite;
            z-index: -2;
        }
        
        @keyframes gridPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        
        /* Futuristic scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 102, 255, 0.15) 2px,
                rgba(0, 102, 255, 0.15) 4px
            );
            animation: scanline 3s linear infinite;
            pointer-events: none;
            z-index: 100;
        }
        
        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }
        
        /* Neon punching bags */
        .neon-bag {
            position: absolute;
            width: 40px;
            height: 120px;
            background: #1a1a1a;
            top: 15%;
            z-index: -1;
            border: 2px solid;
        }
        
        .neon-bag::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 20px;
            background: #ffffff;
            box-shadow: 0 0 10px #ffffff;
        }
        
        .neon-bag::after {
            content: '';
            position: absolute;
            top: 40px;
            left: 5px;
            right: 5px;
            height: 20px;
        }
        
        .neon-bag.left {
            left: 8%;
            border-color: #0066ff;
            box-shadow: 0 0 20px #0066ff, inset 0 0 20px rgba(0, 102, 255, 0.1);
            animation: swingLeftBlue 3s ease-in-out infinite;
        }
        
        .neon-bag.left::after {
            background: #0066ff;
            box-shadow: 0 0 15px #0066ff;
        }
        
        .neon-bag.right {
            right: 8%;
            border-color: #ff6600;
            box-shadow: 0 0 20px #ff6600, inset 0 0 20px rgba(255, 102, 0, 0.1);
            animation: swingRightOrange 3s ease-in-out infinite;
        }
        
        .neon-bag.right::after {
            background: #ff6600;
            box-shadow: 0 0 15px #ff6600;
        }
        
        @keyframes swingLeftBlue {
            0%, 100% { 
                transform: rotate(-3deg);
                box-shadow: 0 0 20px #0066ff, inset 0 0 20px rgba(0, 102, 255, 0.1);
            }
            50% { 
                transform: rotate(3deg);
                box-shadow: 0 0 30px #0066ff, inset 0 0 30px rgba(0, 102, 255, 0.2);
            }
        }
        
        @keyframes swingRightOrange {
            0%, 100% { 
                transform: rotate(-3deg);
                box-shadow: 0 0 20px #ff6600, inset 0 0 20px rgba(0, 102, 255, 0.1);
            }
            50% { 
                transform: rotate(3deg);
                box-shadow: 0 0 30px #ff6600, inset 0 0 30px rgba(0, 102, 255, 0.2);
            }
        }
        
        /* Holographic arena */
        .holo-arena {
            width: 1200PX;
            max-width: 75vw; /* Changed from 1000vw to 75vw */
            background: rgba(10, 10, 10, 0.5);
            border: 3px solid #0066ff;
            padding: 60px;
            position: relative;
            text-align: center;
            box-shadow:
                0 0 50px #0066ff,
                inset 0 0 50px rgba(0, 102, 255, 0.1);
            backdrop-filter: blur(2px);
            animation: blur-loop 5s infinite;
        }

        @keyframes blur-loop {
        0%, 100% {
            backdrop-filter: blur(2px);
        }
        50% {
            backdrop-filter: blur(10px);
        }
        }
        
        .holo-arena::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(45deg, #0066ff, #ff6600, #0066ff, #ff6600);
            opacity: 0.2;
            background-size: 400% 400%;
            animation: holoBorder 6s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes holoBorder {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        /* Neon corner pixels */
        .neon-pixel {
            position: absolute;
            width: 20px;
            height: 20px;
            animation: pixelPulse 2s ease-in-out infinite;
        }
        
        .neon-pixel.top-left, .neon-pixel.bottom-right {
            background: #0066ff;
            box-shadow: 0 0 15px #0066ff;
        }
        
        .neon-pixel.top-right, .neon-pixel.bottom-left {
            background: #ff6600;
            box-shadow: 0 0 15px #ff6600;
        }
        
        @keyframes pixelPulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 0.8;
            }
            50% { 
                transform: scale(1.2);
                opacity: 1;
            }
        }
        
        .neon-pixel.top-left { top: -10px; left: -10px; }
        .neon-pixel.top-right { top: -10px; right: -10px; }
        .neon-pixel.bottom-left { bottom: -10px; left: -10px; }
        .neon-pixel.bottom-right { bottom: -10px; right: -10px; }
        
        /* Header */
        .cyber-header {
            margin-bottom: 40px;
        }
        
        .fight-announcement {
            font-size: 20px;
            color: #ff6600;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #ff6600;
            animation: textGlow 3s ease-in-out infinite;
        }
        
        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 10px #ff6600; }
            50% { text-shadow: 0 0 20px #ff6600, 0 0 30px #ff6600; }
        }
        
        .holo-title {
            font-size: 50px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 8px;
            background: linear-gradient(45deg, #0066ff, #ffffff, #ff6600, #ffffff, #0066ff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: holoShimmer 4s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(0, 102, 255, 0.5);
        }
        
        @keyframes holoShimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .cyber-subtitle {
            font-size: 15px;
            margin-top: 50px;
            color: #1a1a1a;
            letter-spacing: 15px;
            background-color: #ffffff;
            background-size: cover;
            padding: 10px 20px;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            text-shadow: 0 0 30px #ffffff;
            margin: bottom 20px;
        }
        
        /* Countdown gloves */
        .countdown-section {
            margin: 20px 0;
        }
        
        .neon-countdown {
            display: flex;
            justify-content: center;
            gap: 70px;
            flex-wrap: wrap;
        }
        
        .cyber-glove {
            width: 150px;
            height: 150px;
            border-radius: 5%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }
        
        .cyber-glove:nth-child(1) {
            border-color: #0066ff;
            box-shadow: 
                0 0 30px #0066ff,
                inset 0 0 30px rgba(0, 102, 255, 0.2);
            animation: glowBlue 3s ease-in-out infinite;
        }
        
        .cyber-glove:nth-child(2) {
            border-color: #ff6600;
            box-shadow: 
                0 0 30px #ff6600,
                inset 0 0 30px rgba(255, 102, 0, 0.2);
            animation: glowOrange 3s ease-in-out infinite;
        }
        
        .cyber-glove:nth-child(3) {
            border-color: #ffffff;
            box-shadow: 
                0 0 30px #ffffff,
                inset 0 0 30px rgba(102, 102, 102, 0.2);
            animation: glowGrey 3s ease-in-out infinite;
        }
        
        .cyber-glove:nth-child(4) {
            border-color: #ffffff;
            box-shadow: 
                0 0 30px #ffffff,
                inset 0 0 30px rgba(255, 255, 255, 0.2);
            animation: glowWhite 3s ease-in-out infinite;
        }
        
        @keyframes glowBlue {
            0%, 100% { box-shadow: 0 0 30px #0066ff, inset 0 0 30px rgba(0, 102, 255, 0.2); }
            50% { box-shadow: 0 0 50px #0066ff, inset 0 0 50px rgba(0, 102, 255, 0.4); }
        }
        
        @keyframes glowOrange {
            0%, 100% { box-shadow: 0 0 30px #ff6600, inset 0 0 30px rgba(255, 102, 0, 0.2); }
            50% { box-shadow: 0 0 50px #ff6600, inset 0 0 50px rgba(255, 102, 0, 0.4); }
        }
        
        @keyframes glowGrey {
            0%, 100% { box-shadow: 0 0 30px #ffffff, inset 0 0 30px rgba(102, 102, 102, 0.2); }
            50% { box-shadow: 0 0 50px #ffffff, inset 0 0 50px rgba(102, 102, 102, 0.4); }
        }
        
        @keyframes glowWhite {
            0%, 100% { box-shadow: 0 0 30px #ffffff, inset 0 0 30px rgba(255, 255, 255, 0.2); }
            50% { box-shadow: 0 0 50px #ffffff, inset 0 0 50px rgba(255, 255, 255, 0.4); }
        }
        
        /* Cyber thumb */
        .cyber-glove::before {
            content: '';
            position: absolute;
            right: -15px;
            top: 20px;
            width: 30px;
            height: 40px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid;
            border-color: inherit;
            box-shadow: inherit;
        }
        
        .glove-content {
            text-align: center;
            z-index: 10;
        }
        
        .neon-number {
            font-size: 32px;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        
        .cyber-glove:nth-child(1) .neon-number {
            color: #0066ff;
            text-shadow: 0 0 15px #0066ff;
        }
        
        .cyber-glove:nth-child(2) .neon-number {
            color: #ff6600;
            text-shadow: 0 0 15px #ff6600;
        }
        
        .cyber-glove:nth-child(3) .neon-number {
            color: #ffffff;
            text-shadow: 0 0 15px #ffffff;
        }
        
        .cyber-glove:nth-child(4) .neon-number {
            color: #ffffff;
            text-shadow: 0 0 15px #ffffff;
        }
        
        .neon-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: inherit;
        }
        
        /* Message */
        .cyber-message {
            font-size: 16px;
            color: #ffffff;
            line-height: 2;
            max-width: 600px;
            margin: 0 auto;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .holo-separator {
            display: block;
            width: 80%;
            max-width: 400px;
            height: 4px;
            background: #ffffff;
            margin: 30px auto;
            box-shadow: 0 0 15px rgba(148, 182, 233, 0.5);

const REDIRECT_URI = "https://pixelpounders.xyz/callback.html";

function generateRandomString(length = 32) {
  const array = new Uint8Array(length);
  crypto.getRandomValues(array);
  return Array.from(array, dec => dec.toString(16).padStart(2, "0")).join("");
}

document.getElementById("connectBtn").addEventListener("click", () => {
  const state = generateRandomString(16);
  sessionStorage.setItem("worldid_state", state);

  const authorizeUrl = new URL("https://id.worldcoin.org/authorize");
  authorizeUrl.searchParams.set("response_type", "code");
  authorizeUrl.searchParams.set("scope", "openid");
  authorizeUrl.searchParams.set("client_id", APP_ID);
  authorizeUrl.searchParams.set("redirect_uri", REDIRECT_URI);
  authorizeUrl.searchParams.set("state", state);

  // Debug logging
  console.log("🔍 World ID Debug Info:");
  console.log("Client ID:", APP_ID);
  console.log("Redirect URI:", REDIRECT_URI);
  console.log("Full Authorization URL:", authorizeUrl.toString());

  window.location.href = authorizeUrl.toString();
});

<!-- 2️⃣ Countdown Timer -->
<script>
const LAUNCH_DATE_VERSION = '1.5';
const VERSION_KEY = 'launchDateVersion';
const LAUNCH_DATE_KEY = 'launchDate';

let launchDate;
const storedVersion = localStorage.getItem(VERSION_KEY);
const storedLaunchDate = localStorage.getItem(LAUNCH_DATE_KEY);

if (storedVersion !== LAUNCH_DATE_VERSION || !storedLaunchDate) {
  localStorage.removeItem(LAUNCH_DATE_KEY);
  localStorage.removeItem(VERSION_KEY);
  launchDate = new Date('2025-08-22T10:00:00+08:00');
  localStorage.setItem(LAUNCH_DATE_KEY, launchDate.getTime());
  localStorage.setItem(VERSION_KEY, LAUNCH_DATE_VERSION);
} else {
  launchDate = new Date(parseInt(storedLaunchDate));
}

function updateCountdown() {
  const now = new Date().getTime();
  const distance = launchDate.getTime() - now;

  if (distance < 0) {
    document.getElementById('days').textContent = '00';
    document.getElementById('hours').textContent = '00';
    document.getElementById('minutes').textContent = '00';
    document.getElementById('seconds').textContent = '00';
    document.querySelector('.cyber-message').innerHTML = 
      'CYBER ARENA IS LIVE!<br>ENTER THE DIGITAL RING<br>THE FIGHT BEGINS NOW!';
    document.querySelector('.fight-announcement').textContent = 'LIVE NOW';
    return;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

  document.getElementById('days').textContent = days.toString().padStart(2, '0');
  document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
  document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
  document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

<!-- 3️⃣ Particle Effects -->
<script>
function createNeonParticle() {
  const colors = ['#0066ff', '#ff6600', '#ffffff', '#ffffff'];
  const particle = document.createElement('div');
  particle.className = 'neon-particle';
  particle.style.left = Math.random() * 100 + '%';
  particle.style.top = Math.random() * 100 + '%';
  particle.style.animationDelay = Math.random() * 8 + 's';
  const color = colors[Math.floor(Math.random() * colors.length)];
  particle.style.background = color;
  particle.style.boxShadow = `0 0 10px ${color}`;
  document.body.appendChild(particle);

  setTimeout(() => particle.remove(), 1000);
}
setInterval(createNeonParticle, 200);

let mouseX = 0, mouseY = 0, lastMouseX = 0, lastMouseY = 0;
let isMouseMoving = false, particles = [], mouseStopTimeout;

document.addEventListener('mousemove', (e) => {
  lastMouseX = mouseX;
  lastMouseY = mouseY;
  mouseX = e.clientX;
  mouseY = e.clientY;

  if (Math.abs(mouseX - lastMouseX) > 1 || Math.abs(mouseY - lastMouseY) > 1) {
    isMouseMoving = true;
    clearTimeout(mouseStopTimeout);
    mouseStopTimeout = setTimeout(() => isMouseMoving = false, 100);
  }
});

class MouseParticle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.size = Math.random() * 6 + 4;
    this.speedX = (Math.random() - 0.5) * 4;
    this.speedY = Math.random() * 1.5 + 1;
    this.life = 1;
    this.decay = Math.random() * 0.015 + 0.005;
    this.colors = ['#ffffff', '#0066ff', '#ff6600', '#f15e00'];
    this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
    this.element = this.createElement();
  }
  createElement() {
    const particle = document.createElement('div');
    particle.style.position = 'fixed';
    particle.style.left = this.x + 'px';
    particle.style.top = this.y + 'px';
    particle.style.width = this.size + 'px';
    particle.style.height = this.size + 'px';
    particle.style.backgroundColor = this.color;
    particle.style.boxShadow = `0 0 ${this.size * 2}px ${this.color}`;
    particle.style.pointerEvents = 'none';
    particle.style.zIndex = '1000';
    particle.style.imageRendering = 'pixelated';
    document.body.appendChild(particle);
    return particle;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.life -= this.decay;
    this.speedY += 0.05;
    this.element.style.left = this.x + 'px';
    this.element.style.top = this.y + 'px';
    this.element.style.opacity = this.life;
    if (this.life <= 0 || this.y > window.innerHeight + 50) {
      this.element.remove();
      return false;
    }
    return true;
  }
}

function createMouseParticles() {
  if (!isMouseMoving || Math.random() > 0.2) return;
  const offsetX = (Math.random() - 0.5) * 15;
  const offsetY = (Math.random() - 0.5) * 15;
  particles.push(new MouseParticle(mouseX + offsetX, mouseY + offsetY));
}

function animateParticles() {
  particles = particles.filter(particle => particle.update());
  createMouseParticles();
  if (particles.length > 100) {
    particles.splice(0, particles.length - 100).forEach(p => p.element.remove());
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();
</script>
